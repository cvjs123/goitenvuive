    }
    #toggle-wheel-btn:hover { background: rgba(255, 180, 0, 1); }

    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      align-items: center; justify-content: center; z-index: 200;
    }
    .modal-content {
      background: white; padding: 30px; border-radius: 20px;
      width: 90%; max-width: 620px; max-height: 90vh; overflow-y: auto;

    .del-btn { background: #ff4444; color: white; padding: 8px 12px; font-size: 14px; }
    .clear-all-btn { background: #cc0000; color: white; margin-top: 20px; width: 100%; padding: 14px; font-size: 18px; }
    .reset-btn { background: #ff8800; color: white; margin-top: 10px; width: 100%; padding: 14px; font-size: 18px; }
    .confirm-btn { background: #00cc00; color: white; }

    /* ======= CLASS MANAGER STYLES ======= */
    #class-manager {
      background: linear-gradient(135deg, #e8f5e9, #f0fff0);
      border: 2px solid #00cc00;
      border-radius: 16px;
      padding: 16px 18px 14px;
      margin-bottom: 18px;
    }
    #class-manager-title {
      font-size: 16px; font-weight: bold; color: #007700;
      margin: 0 0 12px 0; display: flex; align-items: center; gap: 6px;
    }
    #class-tabs {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-bottom: 12px; min-height: 36px;
    }
    .class-tab {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 12px; border-radius: 25px;
      border: 2px solid #00cc00; background: white;
      cursor: pointer; font-size: 13px; font-weight: bold; color: #006600;
      transition: all 0.18s; -webkit-user-select: none; user-select: none;
    }
    .class-tab:hover { background: #e0ffe0; }
    .class-tab.active {
      background: #00cc00; color: white;
      border-color: #009900;
      box-shadow: 0 3px 10px rgba(0,160,0,0.3);
    }
    .class-tab .tab-name { cursor: pointer; }
    .class-tab .tab-edit-btn, .class-tab .tab-del-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; border-radius: 50%; border: none;
      font-size: 10px; cursor: pointer; padding: 0; margin: 0;
      font-weight: bold; line-height: 1; flex-shrink: 0;
    }
    .class-tab .tab-edit-btn { background: rgba(0,0,0,0.1); color: #333; }
    .class-tab.active .tab-edit-btn { background: rgba(255,255,255,0.3); color: white; }
    .class-tab .tab-del-btn { background: rgba(255,60,60,0.15); color: #cc0000; }
    .class-tab.active .tab-del-btn { background: rgba(255,80,80,0.35); color: #ffdddd; }
    .class-tab .tab-edit-btn:hover { background: #ffe066 !important; color: #333 !important; }
    .class-tab .tab-del-btn:hover { background: #ff4444 !important; color: white !important; }

    #class-edit-area {
      display: none; align-items: center; gap: 8px;
      flex-wrap: wrap; margin-bottom: 10px;

      border-radius: 8px; border: 2px solid #00cc00;
      font-size: 14px; margin: 0;
    }
    #class-edit-area button {
      padding: 8px 12px; font-size: 13px; margin: 0;
    }

    #class-add-row {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    }
    #new-class-input {
      flex: 1; min-width: 130px; padding: 9px 11px;

    #add-class-btn {

    #current-class-label {

      margin: 0 0 10px 0; padding: 7px 12px;
      background: #e8ffe8; border-radius: 8px;
      border-left: 4px solid #00cc00;
    }
    /* ==================================== */

    #quiz-question {
      position: fixed; top: 80px; left: 150px; right: 150px;
      font-size: 54px; font-weight: 700; color: #d40a0a;
      text-align: center; opacity: 0; transition: opacity 0.6s;
      z-index: 30; pointer-events: none; word-wrap: break-word; line-height: 1.4;
    }
    #quiz-question.show { opacity: 1; }

    #quiz-options {
      position: fixed; top: 340px; left: 150px; right: 150px;
      display: flex; flex-wrap: wrap; justify-content: center; gap: 25px;
      opacity: 0; transition: opacity 0.6s; z-index: 30; pointer-events: none;
    }
    #quiz-options.show { opacity: 1; pointer-events: all; }
    .quiz-option {
      flex: 1 1 40%; min-width: 280px; max-width: 45%;
      padding: 30px 20px; font-size: 40px;
      background: rgba(255,255,255,0.15);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      border-radius: 20px; cursor: pointer; transition: all 0.3s;
      color: #000; font-weight: 700; border: 2px solid rgba(0,0,0,0.08);
      text-align: center; white-space: normal; word-wrap: break-word; line-height: 1.5;
    }
    .quiz-option:hover { background: rgba(255,255,255,0.3); transform: scale(1.05); }
    .quiz-option.correct { background: #00cc00; border-color: #00ff00; }
    .quiz-option.wrong { background: #ff4444; border-color: #ff0000; }

    #unlock-screen {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      display: flex; align-items: center; justify-content: center;
      z-index: 300; color: white; font-size: 30px; text-align: center;
      flex-direction: column; cursor: pointer;
    }

    .question-item { flex: 1; line-height: 1.6; }
    .question-item strong { display: block; margin-bottom: 12px; font-size: 17px; }
    .question-item .options { display: block; margin: 12px 0; }
    .question-item .options span { display: block; margin: 8px 0; padding-left: 5px; }
    .correct-answer { color: #d00; font-weight: bold; }
    .modal-divider { margin: 25px 0; }

    #music-modal {
      display: none !important; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 200;
    }
    #music-modal.show { display: flex !important; }
    #music-modal .modal-content { max-width: 500px; }
    #music-modal #music-options { display: flex; flex-direction: column; gap: 15px; }
    .music-option-btn { background: #ff9900; color: white; padding: 15px; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; border: none; }
    .music-option-btn:hover { background: #ffaa00; }
    #music-off-btn { background: #cc0000; color: white; padding: 15px; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; border: none; }
    #music-off-btn:hover { background: #dd0000; }
    #correct-answer {
      width: 100%; padding: 12px; margin: 12px 0;
      border-radius: 8px; border: 1px solid #ccc; font-size: 16px;
    }

    #luck-wheel {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 750px; height: 750px; z-index: 250; display: none; opacity: 0; transition: opacity 0.3s;
    }
    #luck-wheel.show { display: flex; opacity: 1; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
    .wheel {
      width: 700px; height: 700px; border-radius: 50%; position: relative;
      border: 12px solid #FFD700; cursor: pointer;
      background: conic-gradient(
        from 0deg, #FF6B6B 0deg 45deg, #4ECDC4 45deg 90deg,
        #FFE66D 90deg 135deg, #95E1D3 135deg 180deg, #FF85C0 180deg 225deg,
        #A29BFE 225deg 270deg, #FFA502 270deg 315deg, #0984E3 315deg 360deg
      );
    }
    .wheel::before {
      content: ''; position: absolute; width: 100px; height: 100px;
      background: white; border-radius: 50%; top: 50%; left: 50%;
      transform: translate(-50%, -50%); border: 6px solid #FFD700; z-index: 2;
    }
    .wheel::after {
      content: '🎲'; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); font-size: 36px; z-index: 3;
    }
    .wheel-pointer {
      position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 25px solid transparent; border-right: 25px solid transparent;
      border-top: 40px solid #FFD700; z-index: 3;
    }
    .wheel-segment-text {
      position: absolute; width: 140px; height: 50px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: bold; color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      top: 50%; left: 50%; transform-origin: 50% 50%; white-space: nowrap;
    }
    #wheel-spinner .wheel-segment-text:nth-child(1) { transform: translate(-50%,-50%) rotate(22.5deg) translateY(-250px); }
    #wheel-spinner .wheel-segment-text:nth-child(2) { transform: translate(-50%,-50%) rotate(67.5deg) translateY(-250px); }
    #wheel-spinner .wheel-segment-text:nth-child(3) { transform: translate(-50%,-50%) rotate(112.5deg) translateY(-250px); }
    #wheel-spinner .wheel-segment-text:nth-child(4) { transform: translate(-50%,-50%) rotate(157.5deg) translateY(-250px); }
    #wheel-spinner .wheel-segment-text:nth-child(5) { transform: translate(-50%,-50%) rotate(202.5deg) translateY(-250px); }
    #wheel-spinner .wheel-segment-text:nth-child(6) { transform: translate(-50%,-50%) rotate(247.5deg) translateY(-250px); }
    #wheel-spinner .wheel-segment-text:nth-child(7) { transform: translate(-50%,-50%) rotate(292.5deg) translateY(-250px); }
    #wheel-spinner .wheel-segment-text:nth-child(8) { transform: translate(-50%,-50%) rotate(337.5deg) translateY(-250px); }

    #wheel-result {
      display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      min-width: 240px; max-width: 70%; font-size: 24px; font-weight: 800;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      color: #d40a0a; text-align: center; padding: 16px 28px;
      background: linear-gradient(135deg, #00cc44, #00aa33);
      border-radius: 18px; border: 4px solid #ffd700;
      box-shadow: 0 15px 40px rgba(0,204,68,0.4), 0 0 30px rgba(255,215,0,0.3);
      z-index: 3001; line-height: 1.3;
    }
    #wheel-result .prize-title { font-size: 20px; font-weight: 900; }
    #wheel-result.show-overlay::before {
      content: ''; position: fixed; inset: 0;
      background: rgba(0,0,0,0.25); z-index: 3000; border-radius: 0;
    }
  </style>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>

</head>

    import { GestureRecognizer, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    // ============================================================
    //  CLASS MANAGEMENT
    // ============================================================
    const DEFAULT_STUDENTS = [
      "Nguyễn Văn An","Trần Thị Bình","Lê Văn Cường","Phạm Thị Dung","Hoàng Văn Em",
      "Nguyễn Thị Hoa","Vũ Văn Giang","Đỗ Thị Hương","Bùi Văn Khánh","Đặng Thị Lan",
      "Hồ Văn Minh","Lý Thị Na","Mai Văn Phong","Tô Thị Quyên","Đinh Văn Sơn",
      "Phan Thị Thảo","Ngô Văn Út","Đào Thị Vân","Bạch Văn Xuân","Cao Thị Yến"
    ];

    function loadClassData() {
      try {
        const raw = localStorage.getItem('beeClassData');
        if (raw) return JSON.parse(raw);

    async function init() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cams = devices.filter(d=>d.kind==='videoinput');
        const cam = cams.find(c=>c.label.toLowerCase().includes('usb')||c.label.toLowerCase().includes('external')) || cams[0];
        if (cam) selectedCameraId = cam.deviceId;

        const constraints = selectedCameraId
          ? {video:{deviceId:{exact:selectedCameraId},width:{ideal:1280},height:{ideal:720}}}
          : {video:{width:{ideal:1280},height:{ideal:720},facingMode:"user"}};

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        video.onloadedmetadata = () => video.play().catch(()=>{});
        if (video.readyState >= 1) video.play().catch(()=>{});
        resize();

        const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
        recognizer = await GestureRecognizer.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath:"https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/latest/gesture_recognizer.task",
            delegate:"GPU"
          },
          runningMode:"VIDEO", numHands:2,
          minHandDetectionConfidence:0.4, minTrackingConfidence:0.4
        });
        requestAnimationFrame(loop);
      } catch(err) {
        alert("Lỗi camera: "+err.message+"\nỨng dụng vẫn chạy.");
        requestAnimationFrame(loop);
      }
    }

    function loop(time) {
      if (!recognizer) { requestAnimationFrame(loop); return; }
      let results;
      if (video.readyState >= 2) {
        results = recognizer.recognizeForVideo(video, time);
        if (handCanvas.width!==handCanvas.offsetWidth||handCanvas.height!==handCanvas.offsetHeight) {
          handCanvas.width=handCanvas.offsetWidth; handCanvas.height=handCanvas.offsetHeight;
        }
        handCtx.clearRect(0,0,handCanvas.width,handCanvas.height);
        try { handCtx.drawImage(video,0,0,handCanvas.width,handCanvas.height); } catch(e){}
      } else { requestAnimationFrame(loop); return; }

      if (!results) results={landmarks:[],gestures:[]};

      if (results.landmarks.length > 0) {
        unlockAudio();
        const lm = results.landmarks[0];
        drawingUtils.drawConnectors(lm, GestureRecognizer.HAND_CONNECTIONS, {color:'#00FF00',lineWidth:5});
        drawingUtils.drawLandmarks(lm, {color:'#FFFFFF',radius:8});
        targetHandX = (1-lm[9].x)*innerWidth;
        targetHandY = lm[9].y*innerHeight;

        if (results.gestures.length > 0) {
          const gesture = results.gestures[0][0].categoryName;
          const students = getCurrentStudents();
          if (gesture==="Open_Palm" && !rolling && !inQuizMode) {
            rolling=true; if(audioUnlocked) buzzAudio.play().catch(()=>{});
          }
          if (gesture==="Pointing_Up" && rolling) {
            rolling=false; buzzAudio.pause(); buzzAudio.currentTime=0;
            selectTime=Date.now(); questionShown=false; questionShowTime=Date.now()+3000;
            const avail = students.filter(s=>!calledStudents.includes(s));
            selectedStudent = avail.length>0 ? avail[Math.floor(Math.random()*avail.length)] : null;
            if(audioUnlocked) selectAudio.play().catch(()=>{});
            if (questions.length > 0) {
              if (!quizStarted) { quizQueue=[...questions].sort(()=>Math.random()-0.5); currentQuizIndex=0; quizStarted=true; }
              if (currentQuizIndex < quizQueue.length) {
                currentQuiz=quizQueue[currentQuizIndex];
                optionButtons.forEach(b=>{b.textContent='';b.classList.remove('correct','wrong');b.style.pointerEvents='none';});
                inQuizMode=true;
              }
            }
          }
        }
      }

      if (inQuizMode && !questionShown && Date.now()>questionShowTime) {
        quizQuestion.textContent=`Câu ${currentQuizIndex+1}/${quizQueue.length}: ${currentQuiz.question}`;
        quizQuestion.classList.add('show');
        optionButtons[0].textContent=`A. ${currentQuiz.a}`; optionButtons[1].textContent=`B. ${currentQuiz.b}`;
        optionButtons[2].textContent=`C. ${currentQuiz.c}`; optionButtons[3].textContent=`D. ${currentQuiz.d}`;
        optionButtons.forEach(b=>b.style.pointerEvents='all');
        quizOptions.classList.add('show');
        document.getElementById('luck-wheel').classList.remove('show');
        questionShown=true;
      }

      handX += (targetHandX-handX)*0.3;
      handY += (targetHandY-handY)*0.3;

      const students = getCurrentStudents();
      if (rolling && students.length>0 && time-lastRoll>200) {
        selectedStudent=students[Math.floor(Math.random()*students.length)]; lastRoll=time;
      }

      beesCtx.clearRect(0,0,innerWidth,innerHeight);
      const isShowing = selectTime && Date.now()-selectTime<9000;
      if ((rolling||isShowing||inQuizMode) && students.length>0) {
        students.forEach((name,i) => {
          let x,y,scale=1,rot=0,flap=1,alpha=1;
          if (name===selectedStudent && (isShowing||inQuizMode)) {
            const p=Math.min((Date.now()-selectTime)/600,1);
            scale=0.5+p*2; rot=p*720; x=innerWidth/2; y=innerHeight/2;
          } else if (rolling) {
            const angle=(i/students.length)*Math.PI*2+time*0.004;
            const radius=180+Math.sin(time*0.004+i)*120;
            x=handX+Math.cos(angle)*radius+Math.sin(time*0.001)*50;
            y=handY+Math.sin(angle)*radius+Math.sin(time*0.008+i*1.2)*60;
            rot=Math.atan2(Math.sin(angle),Math.cos(angle)*1.5)*180/Math.PI+Math.sin(time*0.01+i)*40;
            flap=1+Math.abs(Math.sin(time*0.04+i))*0.2;
            alpha=0.9+Math.sin(time*0.03+i)*0.1;
          } else return;
          beesCtx.save();
          beesCtx.globalAlpha=alpha; beesCtx.translate(x,y); beesCtx.rotate(rot*Math.PI/180);
          beesCtx.scale(scale*flap,scale);
          beesCtx.drawImage(beeImg,-60,-60,120,120);
          beesCtx.font='bold 34px Arial'; beesCtx.strokeStyle='#000'; beesCtx.lineWidth=10;
          beesCtx.fillStyle='#FFFF00'; beesCtx.textAlign='center'; beesCtx.textBaseline='middle';
          if (name===selectedStudent&&(isShowing||inQuizMode)) {
            beesCtx.scale(1+Math.sin((Date.now()-selectTime)*0.02)*0.1,1+Math.sin((Date.now()-selectTime)*0.02)*0.1);
            beesCtx.shadowBlur=40+Math.sin(time*0.01)*20; beesCtx.shadowColor='#FFFF00';
          }
          beesCtx.strokeText(name,0,80); beesCtx.fillText(name,0,80);
          beesCtx.shadowBlur=0; beesCtx.restore();
        });
      }
      requestAnimationFrame(loop);
    }

    // Wheel logic
    let wheelCloseTimer=null, wheelResultTimer=null;
    const wheelSegments=[
      {text:'🎁 7 Điểm',value:7},{text:'🎁 8 Điểm',value:8},{text:'🎁 9 Điểm',value:9},
      {text:'🎁 5 Điểm',value:5},{text:'🍀 May Mắn Lần Sau!',value:'luck'},
      {text:'⚡ Mất Lượt',value:'lose'},{text:'⭐ Thêm Lượt',value:'bonus'},
      {text:'🎯 6 Điểm',value:6}
    ];

    function showPopup(content) {
      const wr = document.getElementById('wheel-result');
      if (wr._hideTimer) { clearTimeout(wr._hideTimer); wr._hideTimer=null; }
      wr.innerHTML=`<div class="prize-title">${content}</div>`;
      wr.style.display='block'; wr.classList.add('show-overlay');
      wr._hideTimer=setTimeout(()=>{ wr.style.display='none'; wr.classList.remove('show-overlay'); wr._hideTimer=null; },3000);
    }

    function spinWheel() {
      const ws = document.getElementById('wheel-spinner');
      const wr = document.getElementById('wheel-result');
      if (!wheelEnabled||ws.isSpinning) return;
      ws.isSpinning=true; ws.onclick=null;
      wr.style.display='none'; wr.classList.remove('show-overlay');
      const deg=Math.floor(Math.random()*360);
      ws.style.transition=`transform 10s cubic-bezier(0.25,0.46,0.45,0.94)`;
      ws.style.transform=`rotate(${3600+deg}deg)`;
      try{spinAudio.currentTime=0;spinAudio.loop=true;spinAudio.play().catch(()=>{});}catch(e){}
      setTimeout(()=>{
        const final=deg%360;
        const idx=Math.floor(((360-final+360)%360)/45)%wheelSegments.length;
        const result=wheelSegments[idx];
        if(wheelResultTimer){clearTimeout(wheelResultTimer);wheelResultTimer=null;}
        if(wheelCloseTimer){clearTimeout(wheelCloseTimer);wheelCloseTimer=null;}
        try{spinAudio.pause();spinAudio.currentTime=0;}catch(e){}
        ws.style.transition='none'; ws.style.transform=`rotate(${final}deg)`;
        showPopup(result.text);
        try{winAudio.currentTime=0;winAudio.play().catch(()=>{});}catch(e){}
        if(result.value==='bonus'||result.value==='retry'){
          wheelCloseTimer=setTimeout(()=>{ if(wheelEnabled)ws.onclick=spinWheel; ws.isSpinning=false; },3000);
        } else {
          wheelCloseTimer=setTimeout(()=>{
            document.getElementById('luck-wheel').classList.remove('show');
            if(wheelEnabled)ws.onclick=spinWheel; wheelCloseTimer=null;
          },3000);
        }
        ws.isSpinning=false;
      },10000);
    }

    beeImg.onload = () => init();
  </script>
</body>
