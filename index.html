      justify-content: center;
      gap: 20px;
    }

    .wheel {
      width: 700px;
      height: 700px;
      border-radius: 50%;
      position: relative;
      border: 12px solid #FFD700;
      background: conic-gradient(
        from 0deg,
        #FF6B6B 0deg 45deg,   /* Đỏ */
        #4ECDC4 45deg 90deg,  /* Xanh */
        #FFE66D 90deg 135deg, /* Vàng */
        #95E1D3 135deg 180deg,/* Lục */
        #FF85C0 180deg 225deg,/* Hồng */
        #A29BFE 225deg 270deg,/* Tím */
        #FFA502 270deg 315deg,/* Cam */
        #0984E3 315deg 360deg /* Xanh TN */
      );
      cursor: pointer;
    }

    .wheel:hover {
      opacity: 0.95;
    }

    .wheel:active {
      opacity: 0.9;
    }

    .wheel::before {
      content: '';
      position: absolute;
      width: 100px;
      height: 100px;
      background: white;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 6px solid #FFD700;
      z-index: 2;
    }

    .wheel::after {
      content: '🎲';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 36px;
      z-index: 3;
    }

    .wheel-pointer {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 25px solid transparent;
      border-right: 25px solid transparent;
      border-top: 40px solid #FFD700;
      z-index: 3;
    }

    .wheel-segment {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      color: white;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
    }

    .wheel-text {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
    }

    #wheel-result {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      min-width: 240px;
      max-width: 70%;
      font-size: 24px;
      font-weight: 800;
      font-family: 'Comic Sans MS', 'Segoe UI', cursive, sans-serif;
      color: #d40a0a;
      text-align: center;
      padding: 16px 28px;
      background: linear-gradient(135deg, #00cc44, #00aa33);
      border-radius: 18px;
      border: 4px solid #ffd700;
      box-shadow: 0 15px 40px rgba(0, 204, 68, 0.4), 0 0 30px rgba(255, 215, 0, 0.3);
      z-index: 3001;
      line-height: 1.3;
      white-space: normal;
    }
      /* Fancy variants */
      #wheel-result.type-bonus {
        background: linear-gradient(135deg, #00cc44, #00aa33);
        border-color: #ffd700;
        box-shadow: 0 15px 40px rgba(0, 204, 68, 0.4), 0 0 25px rgba(255, 215, 0, 0.3);
        color: #d40a0a;
      }
      #wheel-result.type-retry {
        background: linear-gradient(135deg, #00cc44, #00aa33);
        border-color: #ffd700;
        box-shadow: 0 15px 40px rgba(0, 204, 68, 0.4), 0 0 25px rgba(255, 215, 0, 0.3);
        color: #d40a0a;
      }
      #wheel-result .prize-icon { display:none; font-size:40px; margin-bottom:4px; }
      #wheel-result .prize-title { font-size:20px; font-weight:900; margin-bottom:0; }
      #wheel-result .prize-sub { display:none; }
      @keyframes prize-pulse { 0%{transform:scale(0.98)}50%{transform:scale(1.04)}100%{transform:scale(0.98)} }
      #wheel-result.type-bonus .prize-icon, #wheel-result.type-retry .prize-icon { animation: prize-pulse 1.2s infinite; }

    /* Dim overlay behind popup */
    #wheel-result.show-overlay::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.25);
      z-index: 3000; /* behind popup but above page */
      border-radius: 0;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(3600deg);
      }
    }

    @keyframes bounce {
      0%, 100% { transform: scale(1); }

    }

    .wheel-segment-text {

      top: 50%;
      left: 50%;
      transform-origin: 50% 50%;

    }

    #wheel-spinner .wheel-segment-text:nth-child(1) {

    #wheel-spinner .wheel-segment-text:nth-child(5) {

    }
  </style>

    const beesCanvas = document.getElementById('bees-canvas');
    const handCtx = handCanvas.getContext('2d');
    const beesCtx = beesCanvas.getContext('2d');
    const drawingUtils = new DrawingUtils(handCtx);

    const beeImg = new Image();
    beeImg.src = 'https://static.vecteezy.com/system/resources/previews/021/013/518/non_2x/3d-bee-on-transparent-background-free-png.png';

    const buzzAudio = document.getElementById('buzz-sound');

    const cheerAudio = document.getElementById('cheer-sound');
    const correctAudio = document.getElementById('correct-sound');
    const wrongAudio = document.getElementById('wrong-sound');

    const bgMusicTracks = [
      document.getElementById('bg-music-1'),

          try {
            const data = JSON.parse(e.target.result);
            if (!Array.isArray(data)) throw new Error('File JSON phải là mảng!');
            newQuestions = data.map(q => ({
              question: q.question?.trim() || '',
              a: q.a?.trim() || '',
              b: q.b?.trim() || '',
              c: q.c?.trim() || '',
              d: q.d?.trim() || '',
              correct: String(q.correct || '').toUpperCase()
            })).filter(q => q.question && q.a && q.b && q.c && q.d && ['A','B','C','D'].includes(q.correct));
          } catch (err) {
            return alert('Lỗi đọc file JSON: ' + err.message);
          }
        } else if (file.name.endsWith('.txt')) {
          const content = e.target.result;
          const blocks = content.split(/\n\s*\n/).filter(b => b.trim());
          for (const block of blocks) {
            const lines = block.split('\n').map(l => l.trim());
            let q = { question: '', a: '', b: '', c: '', d: '', correct: '' };
            for (const line of lines) {
              if (line.startsWith('Câu hỏi:')) q.question = line.replace('Câu hỏi:', '').trim();
              else if (line.startsWith('A:')) q.a = line.replace('A:', '').trim();
              else if (line.startsWith('B:')) q.b = line.replace('B:', '').trim();
              else if (line.startsWith('C:')) q.c = line.replace('C:', '').trim();
              else if (line.startsWith('D:')) q.d = line.replace('D:', '').trim();
              else if (line.match(/Đáp án( đúng)?:/i)) q.correct = line.replace(/Đáp án( đúng)?:/i, '').trim().toUpperCase();
            }
            if (q.question && q.a && q.b && q.c && q.d && ['A','B','C','D'].includes(q.correct)) {
              newQuestions.push(q);
            }
          }
        } else if (file.name.endsWith('.docx')) {
          mammoth.convertToHtml({arrayBuffer: e.target.result})
            .then(result => {
              const text = result.value.replace(/<[^>]*>/g, '\n').replace(/\n\n+/g, '\n\n').trim();
              const blocks = text.split(/\n\s*\n/).filter(b => b.trim());
              for (const block of blocks) {
                const lines = block.split('\n').map(l => l.trim());
                let q = { question: '', a: '', b: '', c: '', d: '', correct: '' };
                for (const line of lines) {
                  if (line.startsWith('Câu hỏi:')) q.question = line.replace('Câu hỏi:', '').trim();
                  else if (line.startsWith('A:')) q.a = line.replace('A:', '').trim();
                  else if (line.startsWith('B:')) q.b = line.replace('B:', '').trim();
                  else if (line.startsWith('C:')) q.c = line.replace('C:', '').trim();
                  else if (line.startsWith('D:')) q.d = line.replace('D:', '').trim();
                  else if (line.match(/Đáp án( đúng)?:/i)) q.correct = line.replace(/Đáp án( đúng)?:/i, '').trim().toUpperCase();
                }
                if (q.question && q.a && q.b && q.c && q.d && ['A','B','C','D'].includes(q.correct)) {
                  newQuestions.push(q);
                }
              }
              finalizeImport(newQuestions);
            })
            .catch(err => alert('Lỗi đọc file Word: ' + err.message));
          return;
        } else {
          return alert('Chỉ hỗ trợ file .json, .txt hoặc .docx!');
        }

        finalizeImport(newQuestions);
      };

      if (file.name.endsWith('.docx')) {

      }

    async function getAvailableCameras() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        availableCameras = devices.filter(device => device.kind === 'videoinput');
        
        // Ưu tiên camera USB nếu có
        let selectedCamera = availableCameras.find(cam => 
          cam.label.toLowerCase().includes('usb') || cam.label.toLowerCase().includes('external')
        );
        
        // Nếu không có camera USB riêng, lấy camera đầu tiên khác
        if (!selectedCamera && availableCameras.length > 0) {
          selectedCamera = availableCameras[0];
        }
        
        if (selectedCamera) {
          selectedCameraId = selectedCamera.deviceId;
          console.log("Đã chọn camera:", selectedCamera.label);
        }
        
        return availableCameras;
      } catch (err) {
        console.error("Lỗi liệt kê camera:", err);
        return [];
      }
    }

    async function init() {
      try {
        // Liệt kê các camera có sẵn
        await getAvailableCameras();
        
        // Tạo constraints cho getUserMedia
        let constraints = { 
          video: { 
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: "user" 
          } 
        };
        if (selectedCameraId) {
          constraints = { 
            video: { 
              deviceId: { exact: selectedCameraId },
              width: { ideal: 1280 },
              height: { ideal: 720 }
            } 
          };
        }
        
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        
        // Chờ video có sẵn metadata trước khi play
        video.onloadedmetadata = () => {
          video.play().catch(err => {
            console.error("Lỗi play video:", err);
          });
        };
        
        // Nếu metadata đã load sẵn
        if (video.readyState >= 1) {
          video.play().catch(err => {
            console.error("Lỗi play video:", err);
          });
        }
        
        resize();

        const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
        recognizer = await GestureRecognizer.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/latest/gesture_recognizer.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numHands: 2,
          minHandDetectionConfidence: 0.4,
          minTrackingConfidence: 0.4
        });

        requestAnimationFrame(loop);
      } catch (err) {
        let errorMsg = "Lỗi khởi động camera: " + err.message;
        
        if (err.name === 'NotFoundError' || err.name === 'NotAllowedError') {
          errorMsg = "Camera không được tìm thấy hoặc bạn chưa cấp phép.\n\n" +
            "Kiểm tra:\n" +
            "1. Cắm USB camera vào máy\n" +
            "2. Kiểm tra thiết bị trong Quản lý thiết bị (Device Manager)\n" +
            "3. Cho phép truy cập camera khi trình duyệt yêu cầu\n" +
            "4. Tải lại trang web (F5)\n\n" +
            "Ứng dụng vẫn chạy nhưng không nhận diện tay.";
        } else if (err.name === 'NotAllowedError') {
          errorMsg = "Bạn chưa cấp quyền truy cập camera cho trình duyệt.\n\n" +
            "Vui lòng:\n" +
            "1. Kiểm tra thanh địa chỉ trình duyệt (ngoài cùng bên trái)\n" +
            "2. Nhấp vào biểu tượng camera và cho phép truy cập\n" +
            "3. Tải lại trang web (F5)";
        }
        
        console.error("Chi tiết lỗi:", err);
        alert(errorMsg);
        requestAnimationFrame(loop);
      }
    }

    function loop(time) {
      let results;
      
      if (!recognizer) {
        requestAnimationFrame(loop);
        return;
      }

      // Chỉ vẽ khi video sẵn sàng
      if (video.readyState >= 2) {
        results = recognizer.recognizeForVideo(video, time);

        // Đảm bảo canvas có kích thước chính xác
        if (handCanvas.width !== handCanvas.offsetWidth || handCanvas.height !== handCanvas.offsetHeight) {
          handCanvas.width = handCanvas.offsetWidth;
          handCanvas.height = handCanvas.offsetHeight;
        }

        handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);
        
        try {
          handCtx.drawImage(video, 0, 0, handCanvas.width, handCanvas.height);
        } catch (e) {
          console.warn("Video không sẵn sàng để vẽ:", e);
        }
      } else {
        requestAnimationFrame(loop);
        return;
      }

      if (!results) results = { landmarks: [], gestures: [] };

      if (results.landmarks.length > 0) {
        unlockAudio();

        const lm = results.landmarks[0];
        drawingUtils.drawConnectors(lm, GestureRecognizer.HAND_CONNECTIONS, { color: '#00FF00', lineWidth: 5 });
        drawingUtils.drawLandmarks(lm, { color: '#FFFFFF', radius: 8 });

        targetHandX = (1 - lm[9].x) * innerWidth;
        targetHandY = lm[9].y * innerHeight;

        if (results.gestures.length > 0) {
          const gesture = results.gestures[0][0].categoryName;
          if (gesture === "Open_Palm" && !rolling && !inQuizMode) {
            rolling = true;
            if (audioUnlocked) {
              buzzAudio.play().catch(() => {});
            }
          }
          if (gesture === "Pointing_Up" && rolling) {
            rolling = false;
            buzzAudio.pause();
            buzzAudio.currentTime = 0;
            selectTime = Date.now();
            questionShown = false;
            questionShowTime = Date.now() + 3000;

            selectedStudent = students[Math.floor(Math.random() * students.length)];

            if (audioUnlocked) {
              selectAudio.play().catch(() => {});
            }

            if (questions.length > 0) {
              if (!quizStarted) {
                quizQueue = [...questions].sort(() => Math.random() - 0.5);
                currentQuizIndex = 0;
                quizStarted = true;
              }

              if (currentQuizIndex < quizQueue.length) {
                currentQuiz = quizQueue[currentQuizIndex];

                optionButtons.forEach(b => {
                  b.textContent = '';
                  b.classList.remove('correct', 'wrong');
                  b.style.pointerEvents = 'none';
                });

                inQuizMode = true;
              }
            }
          }
        }
      }

      if (inQuizMode && !questionShown && Date.now() > questionShowTime) {
        quizQuestion.textContent = `Câu ${currentQuizIndex + 1}/${quizQueue.length}: ${currentQuiz.question}`;
        quizQuestion.classList.add('show');

        optionButtons[0].textContent = `A. ${currentQuiz.a}`;
        optionButtons[1].textContent = `B. ${currentQuiz.b}`;
        optionButtons[2].textContent = `C. ${currentQuiz.c}`;
        optionButtons[3].textContent = `D. ${currentQuiz.d}`;
        optionButtons.forEach(b => b.style.pointerEvents = 'all');
        quizOptions.classList.add('show');
        
        // Ẩn vòng quay khi tiếp tục câu hỏi tiếp theo
        const luckWheel = document.getElementById('luck-wheel');
        luckWheel.classList.remove('show');
        
        questionShown = true;
      }

      handX += (targetHandX - handX) * 0.3;
      handY += (targetHandY - handY) * 0.3;

      if (rolling && students.length > 0 && time - lastRoll > 200) {
        selectedStudent = students[Math.floor(Math.random() * students.length)];
        lastRoll = time;
      }

      beesCtx.clearRect(0, 0, innerWidth, innerHeight);

      const isShowing = selectTime && Date.now() - selectTime < 9000;
      if ((rolling || isShowing || inQuizMode) && students.length > 0) {
        students.forEach((name, i) => {
          let x, y, scale = 1, rot = 0, flap = 1, alpha = 1;
          if (name === selectedStudent && (isShowing || inQuizMode)) {
            const progress = Math.min((Date.now() - selectTime) / 600, 1);
            scale = 0.5 + progress * 2;
            rot = progress * 720;
            x = innerWidth / 2;
            y = innerHeight / 2;
          } else if (rolling) {
            const angle = (i / students.length) * Math.PI * 2 + time * 0.004;
            const radius = 180 + Math.sin(time * 0.004 + i) * 120;
            const wave = Math.sin(time * 0.008 + i * 1.2) * 60;
            const swirl = Math.sin(time * 0.001) * 50;
            x = handX + Math.cos(angle) * radius + swirl;
            y = handY + Math.sin(angle) * radius + wave;
            rot = Math.atan2(Math.sin(angle), Math.cos(angle) * 1.5) * 180 / Math.PI + Math.sin(time * 0.01 + i) * 40;
            flap = 1 + Math.abs(Math.sin(time * 0.04 + i)) * 0.2;
            alpha = 0.9 + Math.sin(time * 0.03 + i) * 0.1;
          } else return;

          beesCtx.save();
          beesCtx.globalAlpha = alpha;
          beesCtx.translate(x, y);
          beesCtx.rotate(rot * Math.PI / 180);
          beesCtx.scale(scale * flap, scale);
          beesCtx.drawImage(beeImg, -60, -60, 120, 120);

          beesCtx.font = 'bold 34px Arial';
          beesCtx.strokeStyle = '#000';
          beesCtx.lineWidth = 10;
          beesCtx.fillStyle = '#FFFF00';
          beesCtx.textAlign = 'center';
          beesCtx.textBaseline = 'middle';

          if (name === selectedStudent && (isShowing || inQuizMode)) {
            const bounce = 1 + Math.sin((Date.now() - selectTime) * 0.02) * 0.1;
            beesCtx.scale(bounce, bounce);
            beesCtx.shadowBlur = 40 + Math.sin(time * 0.01) * 20;
            beesCtx.shadowColor = '#FFFF00';
          }

          beesCtx.strokeText(name, 0, 80);
          beesCtx.fillText(name, 0, 80);
          beesCtx.shadowBlur = 0;
          beesCtx.restore();
        });
      }

      requestAnimationFrame(loop);
    }

    // Vòng quay may mắn - Mỗi màu tương ứng 1 phần thưởng
    let wheelCloseTimer = null;
    let wheelResultTimer = null;
    const wheelSegments = [
      { text: '🎁 7 Điểm', value: 7, color: '#FF6B6B' },
      { text: '🎁 8 Điểm', value: 8, color: '#4ECDC4' },
      { text: '🎁 9 Điểm', value: 9, color: '#FFE66D' },
      { text: '🎁 10 Điểm', value: 10, color: '#95E1D3' },
      { text: '🍀 May Mắn Lần Sau!', value: 'luck', color: '#FF85C0' },
      { text: '⚡ Mất Lượt', value: 'lose', color: '#A29BFE' },
      { text: '⭐ Bonus +2', value: 'bonus', color: '#FFA502' },
      { text: '🎯 Chơi Lại', color: '#0984E3' }
    ];

    // Hiển thị popup kết quả (chuẩn hóa hiển thị + overlay + timer)
    function showPopup(htmlContent, bgColor, type) {
      const wheelResult = document.getElementById('wheel-result');
      if (!wheelResult) return;
      if (wheelResult._hideTimer) { clearTimeout(wheelResult._hideTimer); wheelResult._hideTimer = null; }

      // Build structured content
      const icon = type === 'bonus' ? '⭐' : (type === 'retry' ? '🔁' : '🎉');
      wheelResult.innerHTML = `<div class="prize-icon">${icon}</div><div class="prize-title">${htmlContent}</div>`;
      wheelResult.className = ''; // reset classes
      wheelResult.classList.add(type ? ('type-' + type) : 'type-default');
      wheelResult.style.display = 'block';
      wheelResult.classList.add('show-overlay');

      // auto-hide after 3s
      wheelResult._hideTimer = setTimeout(() => {
        wheelResult.style.display = 'none';
        wheelResult.classList.remove('show-overlay');
        wheelResult._hideTimer = null;
      }, 3000);
    }

    function spinWheel() {
      const wheelSpinner = document.getElementById('wheel-spinner');
      const wheelResult = document.getElementById('wheel-result');
      
      if (wheelSpinner.isSpinning) return;
      wheelSpinner.isSpinning = true;
      wheelSpinner.onclick = null;
      wheelResult.style.display = 'none';
      wheelResult.classList.remove('show-overlay');

      // Quay ngẫu nhiên từ 0 đến 359 độ
      const randomDegree = Math.floor(Math.random() * 360);
      const totalRotation = 3600 + randomDegree; // 10 vòng + ngẫu nhiên

      // Phát âm thanh quay (loop) khi bắt đầu
      try { spinAudio.currentTime = 0; spinAudio.loop = true; spinAudio.play().catch(()=>{}); } catch(e){}

      const spinDuration = 10; // Thời gian quay
      // Sử dụng easing: nhanh lúc đầu, chậm dần về cuối
      wheelSpinner.style.transition = `transform ${spinDuration}s cubic-bezier(0.25, 0.46, 0.45, 0.94)`;
      wheelSpinner.style.transform = `rotate(${totalRotation}deg)`;

      setTimeout(() => {
        // Tính toán kết quả dựa trên góc cuối cùng
        const finalDegree = randomDegree % 360;
        const pointerAngle = (360 - finalDegree + 360) % 360;
        const segmentIndex = Math.floor(pointerAngle / 45) % wheelSegments.length;
        const result = wheelSegments[segmentIndex];

        // Xóa các timeout cũ nếu có để tránh hiển thị trùng
        if (wheelResultTimer) { clearTimeout(wheelResultTimer); wheelResultTimer = null; }
        if (wheelCloseTimer) { clearTimeout(wheelCloseTimer); wheelCloseTimer = null; }

        // Dừng âm thanh quay
        try { spinAudio.pause(); spinAudio.currentTime = 0; } catch(e){}
        
        // BỎ hiệu ứng transition để không méo hình
        wheelSpinner.style.transition = 'none';
        wheelSpinner.style.transform = `rotate(${finalDegree}deg)`;

        // Hiển thị thông báo phần thưởng (popup)
        if (wheelResultTimer) { clearTimeout(wheelResultTimer); wheelResultTimer = null; }
        showPopup(result.text, result.color || 'rgba(255, 215, 0, 0.9)');

        // Phát âm thanh trúng thưởng
        try {
          winAudio.currentTime = 0; winAudio.play().catch(()=>{});
        } catch(e){}

        // Xử lý kết quả dựa trên loại phần thưởng
        if (result.value === 'bonus') {
          wheelSpinCount += 2; // Thêm 2 lượt quay
          
          // Cho phép quay lại sau khi thông báo ẩn (3 giây)
          wheelCloseTimer = setTimeout(() => {
            wheelSpinner.onclick = spinWheel;
            wheelSpinner.isSpinning = false;
          }, 3000);
        } else if (result.value === 'retry') {
          wheelSpinCount += 1; // Thêm 1 lượt quay
          
          // Chơi lại - giống như bonus, để bánh quay mở để quay tiếp
          wheelCloseTimer = setTimeout(() => {
            wheelSpinner.onclick = spinWheel;
            wheelSpinner.isSpinning = false;
          }, 3000);
        } else if (result.value === 'lose') {
          // Mất lượt - hiển thị kết quả 3 giây rồi đóng
          wheelCloseTimer = setTimeout(() => {
            document.getElementById('luck-wheel').classList.remove('show');
            const spinner = document.getElementById('wheel-spinner');
            spinner.onclick = spinWheel;
            wheelCloseTimer = null;
          }, 3000);
        } else {
          // Các phần thưởng điểm số hoặc may mắn
          wheelCloseTimer = setTimeout(() => {
            document.getElementById('luck-wheel').classList.remove('show');
            const spinner = document.getElementById('wheel-spinner');
            spinner.onclick = spinWheel;
            wheelCloseTimer = null;
          }, 3000);
        }

        wheelSpinner.isSpinning = false;
      }, spinDuration * 1000); // Sử dụng spinDuration
    }

    beeImg.onload = () => init();
  </script>
  <div id="wheel-result"></div>
</body>
</html>
