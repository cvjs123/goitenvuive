<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vườn Ong Bay - Điểm Danh & Trắc Nghiệm</title>
  <style>
    /* Giữ nguyên toàn bộ CSS như trước */
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    #bg { position: fixed; inset: 0;
      background: url('https://static.vecteezy.com/system/resources/thumbnails/040/806/603/small_2x/ai-generated-a-beautiful-garden-scene-with-butterflies-and-beautiful-flowers-free-video.jpg') center/cover no-repeat;
    }
    /* ... (toàn bộ CSS khác giữ nguyên như file mới nhất) ... */
  </style>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
</head>
<body>
  <!-- Giữ nguyên toàn bộ phần body như file trước -->

  <div id="question-modal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Biên Soạn Câu Hỏi Trắc Nghiệm</h2>
      <input type="text" id="new-question" placeholder="Nhập câu hỏi">
      <input type="text" id="option-a" placeholder="Đáp án A">
      <input type="text" id="option-b" placeholder="Đáp án B">
      <input type="text" id="option-c" placeholder="Đáp án C">
      <input type="text" id="option-d" placeholder="Đáp án D">
      <select id="correct-answer">
        <option value="">Chọn đáp án đúng</option>
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
      </select>
      <button class="add-btn" id="add-question-btn">➕ Thêm Câu Hỏi</button>
      
      <hr style="margin: 25px 0;">
      <label><strong>📂 Nhập từ file JSON hoặc TXT</strong></label>
      <input type="file" id="questions-file" accept=".json,.txt">
      <button class="import-btn" id="import-questions-btn">⬆️ Nhập Từ File</button>
      <button class="sample-btn" id="sample-questions-btn">📥 Tải File Mẫu JSON</button>
      
      <ul id="question-list"></ul>
      <button class="clear-all-btn" id="clear-questions-btn">🗑️ Xóa Tất Cả Câu Hỏi</button>
    </div>
  </div>

  <!-- Giữ nguyên phần âm thanh -->

  <script type="module">
    // Giữ nguyên toàn bộ script như file trước đến phần quản lý modal

    // THÊM MỚI: Xử lý nhập câu hỏi từ file
    document.getElementById('import-questions-btn').addEventListener('click', () => {
      const fileInput = document.getElementById('questions-file');
      const file = fileInput.files[0];
      if (!file) return alert('Vui lòng chọn file!');

      const reader = new FileReader();
      reader.onload = function(e) {
        const content = e.target.result;
        let newQuestions = [];

        if (file.name.endsWith('.json')) {
          try {
            const data = JSON.parse(content);
            if (!Array.isArray(data)) throw new Error('File JSON phải là một mảng các câu hỏi!');
            newQuestions = data.map(q => ({
              question: q.question?.trim() || '',
              a: q.a?.trim() || q.options?.[0]?.trim() || '',
              b: q.b?.trim() || q.options?.[1]?.trim() || '',
              c: q.c?.trim() || q.options?.[2]?.trim() || '',
              d: q.d?.trim() || q.options?.[3]?.trim() || '',
              correct: String(q.correct || '').toUpperCase()
            })).filter(q => q.question && q.a && q.b && q.c && q.d && ['A','B','C','D'].includes(q.correct));
          } catch (err) {
            return alert('Lỗi đọc file JSON: ' + err.message);
          }
        } else if (file.name.endsWith('.txt')) {
          const blocks = content.split(/\n\s*\n/).filter(b => b.trim());
          for (const block of blocks) {
            const lines = block.split('\n').map(l => l.trim());
            let q = { question: '', a: '', b: '', c: '', d: '', correct: '' };
            for (const line of lines) {
              if (line.startsWith('Câu hỏi:')) q.question = line.replace('Câu hỏi:', '').trim();
              else if (line.startsWith('A:')) q.a = line.replace('A:', '').trim();
              else if (line.startsWith('B:')) q.b = line.replace('B:', '').trim();
              else if (line.startsWith('C:')) q.c = line.replace('C:', '').trim();
              else if (line.startsWith('D:')) q.d = line.replace('D:', '').trim();
              else if (line.startsWith('Đáp án:')) q.correct = line.replace('Đáp án:', '').trim().toUpperCase();
            }
            if (q.question && q.a && q.b && q.c && q.d && ['A','B','C','D'].includes(q.correct)) {
              newQuestions.push(q);
            }
          }
        } else {
          return alert('Chỉ hỗ trợ file .json hoặc .txt!');
        }

        if (newQuestions.length === 0) return alert('Không tìm thấy câu hỏi hợp lệ nào trong file!');

        // Thêm vào danh sách hiện tại (tránh trùng)
        let added = 0;
        newQuestions.forEach(nq => {
          const exists = questions.some(eq => 
            eq.question === nq.question && 
            eq.a === nq.a && eq.b === nq.b && eq.c === nq.c && eq.d === nq.d && eq.correct === nq.correct
          );
          if (!exists) {
            questions.push(nq);
            added++;
          }
        });

        localStorage.setItem('beeQuestions', JSON.stringify(questions));
        updateQuestionList();
        alert(`Đã thêm ${added} câu hỏi mới (tổng cộng ${questions.length} câu)!`);
        fileInput.value = ''; // reset input file
      };
      reader.readAsText(file);
    });

    // Tải file mẫu JSON
    document.getElementById('sample-questions-btn').addEventListener('click', () => {
      const sampleData = [
        {
          "question": "Thủ đô của Việt Nam là gì?",
          "a": "Hà Nội",
          "b": "TP. Hồ Chí Minh",
          "c": "Đà Nẵng",
          "d": "Cần Thơ",
          "correct": "A"
        },
        {
          "question": "2 + 2 = ?",
          "a": "3",
          "b": "4",
          "c": "5",
          "d": "6",
          "correct": "B"
        }
      ];
      const blob = new Blob([JSON.stringify(sampleData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'mau_cau_hoi_trac_nghiem.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    // Giữ nguyên toàn bộ script còn lại (gesture, loop, âm thanh, v.v.)

    beeImg.onload = () => init();
  </script>
</body>
</html>
